[project]
name = "restaurant-finder-ui"
version = "0.1.0"
description = "Chainlit UI for Restaurant Finder AI Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "chainlit==2.12.0",
    "boto3>=1.42.0",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
local-aws = ["botocore[crt]>=1.42.37"]

[project.scripts]
start = "chainlit:run"
